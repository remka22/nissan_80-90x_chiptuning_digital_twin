; Сборка МОСТА ЭБУ<->ноут для ESP32 DevKit.
;
; Собирать так (из этой папки):
;     python3 -m platformio run
; Залить:
;     python3 -m platformio run -t upload --upload-port /dev/cu.usbserial-1430
;
; ⚠ huge_app: под приложение 3 МБ вместо стандартных 1.31. Нужно потому, что
; Bluetooth и Wi-Fi вместе в стандартную разметку НЕ ВЛЕЗАЮТ (один только
; Bluetooth занимал 84%). Плата за это — нет OTA, шить только по USB.
;
; ⚠ ВТОРОЙ СКЕТЧ (дисплей на телефон) ЛЕЖИТ В ПОДПАПКЕ dash/ СО СВОИМ ini.
; Так пришлось сделать потому, что PlatformIO склеивает ВСЕ .ino из папки
; проекта в один скетч — два setup()/loop() не собираются, а build_src_filter
; не спасает: он применяется уже к сгенерированному .cpp.
; Здесь подпапка исключена фильтром ниже, иначе мост тянул бы её к себе.
;
; arduino-cli не подошёл: downloads.arduino.cc отдаёт 403, а тулчейн с
; release-assets.githubusercontent.com рвётся. PlatformIO тянет со своего реестра.

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
build_src_filter = +<*> -<dash/>
monitor_speed = 15625
