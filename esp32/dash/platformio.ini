; Дисплей на телефон — ОТДЕЛЬНЫЙ проект.
;
; ⚠ ПОЧЕМУ ОТДЕЛЬНАЯ ПАПКА: PlatformIO (как и Arduino IDE) склеивает ВСЕ .ino
; из папки проекта в один скетч. Два скетча рядом = два setup()/loop() = не
; собирается, а build_src_filter тут не помогает: фильтр применяется уже к
; сгенерированному .cpp. Поэтому у каждого скетча своя папка и свой ini.
;
; Собрать:  python3 -m platformio run
; Залить:   python3 -m platformio run -t upload --upload-port /dev/cu.usbserial-1430
; Монитор:  python3 -m platformio device monitor -b 115200 -p /dev/cu.usbserial-1430

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; huge_app не нужен: Bluetooth здесь нет, только Wi-Fi. Стандартной разметки хватает.
monitor_speed = 115200
